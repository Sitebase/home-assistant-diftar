[project]
name = "home-assistant-diftar"
version = "0.1.0"
description = "Home Assistant integration for mijndiftar.be"
requires-python = ">=3.13"

[dependency-groups]
dev = ["pytest-homeassistant-custom-component==0.13.373", "ruff==0.17.2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "D", "PL"]
ignore = ["D203", "D213", "E501", "PLR2004", "PLR0913"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.diftar", "homeassistant"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103", "PLR0915"]
